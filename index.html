  <style>
    :root {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-alt: #162032;
      --surface-light: #283549;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --rain: #60a5fa;
      --green: #34d399;
      --purple: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Rubik', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top right, #172554 0%, #0b1120 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 14px 12px 54px;
      line-height: 1.5;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.94), rgba(15, 23, 42, 0.98));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

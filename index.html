<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>סיפור דרך ומזג אוויר חי | אלזס ושווייץ 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-alt: #162032;
      --surface-light: #283549;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --rain: #60a5fa;
      --green: #34d399;
      --purple: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Rubik', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top right, #172554 0%, #0b1120 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 14px 12px 54px;
      line-height: 1.5;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.94), rgba(15, 23, 42, 0.98));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(52, 211, 153, 0.14);
      color: var(--green);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .refresh-btn:active {
      background: rgba(255, 255, 255, 0.18);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .subtitle {
      font-size: 0.86rem;
      color: var(--muted);
    }

    .meta-bar {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 6px;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--surface-alt);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 10px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    .tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 0 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 13px;
      padding: 8px 13px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.18);
      color: var(--accent);
      border-color: var(--accent);
    }

    .tab-btn span {
      display: block;
      font-size: 0.7rem;
      font-weight: 400;
      opacity: 0.85;
    }

    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .day-title {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .day-route {
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 500;
      margin-top: 2px;
    }

    .weather-mini-pill {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 10px;
      text-align: center;
      flex-shrink: 0;
    }

    .weather-mini-temp {
      font-size: 1.05rem;
      font-weight: 800;
      direction: ltr;
    }

    .weather-mini-sub {
      font-size: 0.7rem;
      color: var(--rain);
      font-weight: 600;
    }
